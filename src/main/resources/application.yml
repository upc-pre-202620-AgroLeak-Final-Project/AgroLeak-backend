spring:
  application:
    name: agroleak-backend
  profiles:
    default: dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-version: 0
    baseline-on-migrate: false
    clean-disabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
server:
  port: ${PORT:8081}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs
agroleak:
  presentation-data-enabled: ${PRESENTATION_DATA_ENABLED:false}
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:5173}
  demo-data-enabled: false
  detection:
    leak-threshold-percent: ${LEAK_THRESHOLD_PERCENT:20.0}
    min-flow-for-analysis: 3.0
    pressure-min-bar: ${PRESSURE_MIN_BAR:1.0}
    pressure-max-bar: ${PRESSURE_MAX_BAR:4.0}
    obstruction-flow-out-threshold: 5.0
    obstruction-pressure-threshold: 3.2
    pair-window-seconds: 120
  offline:
    enabled: true
    timeout-seconds: ${DEVICE_OFFLINE_SECONDS:300}
    check-interval-ms: 60000
  pests:
    alert-min-count: ${PEST_ALERT_MIN_COUNT:5}
    alert-min-confidence: ${PEST_ALERT_MIN_CONFIDENCE:0.7}
  analytics:
    max-hold-seconds: ${FLOW_MAX_HOLD_SECONDS:300}
