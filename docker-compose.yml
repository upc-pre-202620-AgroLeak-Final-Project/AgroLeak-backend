services:
  postgres:
    image: postgres:16-alpine
    container_name: agroleak-postgres
    environment:
      POSTGRES_DB: agroleak
      POSTGRES_USER: agroleak
      POSTGRES_PASSWORD: agroleak
    ports:
      - "5432:5432"
    volumes:
      - agroleak_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agroleak -d agroleak"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agroleak_pgdata:
